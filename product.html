<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi tiết sản phẩm - ModaShop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="header-main container">
      <a href="index.html" class="logo">ModaShop</a>

      <form class="search-box" id="searchForm">
        <input type="text" id="searchInput" placeholder="Tìm áo, quần, giày, túi xách...">
        <button type="submit">Tìm kiếm</button>
      </form>

      <a href="cart.html" class="cart">Giỏ hàng <span class="cart-count" id="cartCount">0</span></a>
    </div>
  </header>

  <main class="container">

    <!-- Đường dẫn: Trang chủ > Danh mục > Sản phẩm -->
    <nav class="breadcrumb" id="breadcrumb"></nav>

    <!-- Ảnh, giá, chọn màu/size, mô tả (tạo bằng script.js) -->
    <div id="productDetail"></div>

    <!-- Sản phẩm tương tự -->
    <section class="section">
      <h2 class="section-title">SẢN PHẨM TƯƠNG TỰ</h2>
      <div class="product-grid" id="relatedGrid"></div>
    </section>

  </main>

  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
