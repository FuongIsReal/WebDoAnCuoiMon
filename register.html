<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký - ModaShop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

  <!-- Header đơn giản -->
  <header class="auth-header">
    <div class="container auth-header-inner">
      <a href="index.html" class="auth-logo">ModaShop</a>
      <span class="auth-page-title">Đăng ký</span>
    </div>
  </header>

  <main class="auth-main">
    <div class="container auth-wrap">

      <!-- Bên trái: giới thiệu -->
      <div class="auth-intro">
        <h1>ModaShop</h1>
        <p>Thời trang giá tốt mỗi ngày</p>
      </div>

      <!-- Bên phải: form đăng ký -->
      <form class="auth-box" id="registerForm" novalidate>
        <h2>Đăng ký</h2>

        <div class="form-group">
          <input type="text" id="regName" placeholder="Họ và tên">
          <p class="field-error" id="regNameError"></p>
        </div>

        <div class="form-group">
          <input type="text" id="regAccount" placeholder="Email hoặc số điện thoại">
          <p class="field-error" id="regAccountError"></p>
        </div>

        <div class="form-group">
          <div class="password-box">
            <input type="password" id="regPassword" placeholder="Mật khẩu (ít nhất 6 ký tự)">
            <button type="button" class="toggle-pass" data-target="regPassword">Hiện</button>
          </div>
          <p class="field-error" id="regPasswordError"></p>
        </div>

        <div class="form-group">
          <div class="password-box">
            <input type="password" id="regConfirm" placeholder="Nhập lại mật khẩu">
            <button type="button" class="toggle-pass" data-target="regConfirm">Hiện</button>
          </div>
          <p class="field-error" id="regConfirmError"></p>
        </div>

        <button type="submit" class="btn-main auth-submit">ĐĂNG KÝ</button>

        <p class="auth-note">
          Bằng việc đăng ký, bạn đồng ý với <a href="#">Điều khoản dịch vụ</a>
          và <a href="#">Chính sách bảo mật</a> của ModaShop.
        </p>

        <p class="auth-switch">
          Bạn đã có tài khoản? <a href="login.html">Đăng nhập</a>
        </p>
      </form>

    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
